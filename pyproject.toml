[project]
name = "reserch2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hasala Gayendra", email = "hashalagayendra@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "pgvector>=0.2.5",
    "langchain-openrouter>=0.2.7",
    "langchain-core>=1.5.3",
    "langgraph>=1.2.10",
    "python-dotenv>=1.2.2",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.2",
    "duckduckgo-search>=8.1.1",
    "self-evolving-workflow",
]

[tool.uv.sources]
self-evolving-workflow = { path = "../Reserch-Developer-Package", editable = true }

[dependency-groups]
dev = ["pytest>=9.0.0", "httpx>=0.28.1"]

[tool.pyright]
venvPath = "."
venv = ".venv"

